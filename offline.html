<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f28c28">
  <title>オフライン</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(242, 140, 40, 0.14), transparent 34%),
        linear-gradient(180deg, #faf7f2 0%, #f6f1e8 100%);
      color: #1f2937;
    }
    .card {
      max-width: 520px;
      margin: 24px;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 48px rgba(31, 41, 55, 0.12);
      border: 1px solid rgba(31, 41, 55, 0.12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.8rem;
    }
    p {
      margin: 0;
      line-height: 1.7;
      color: #4b5563;
    }
    a {
      color: #f28c28;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>オフラインです</h1>
    <p>保存済みのページがあれば表示できます。通信が戻ったら再読み込みしてください。<a href="./menu/">メニュー一覧へ</a></p>
  </section>
</body>
</html>
